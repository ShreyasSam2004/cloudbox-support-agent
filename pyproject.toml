[project]
name = "cloudbox-support-agent"
version = "1.0.0"
description = "Agentic, self-correcting customer-support RAG system for CloudBox (fictional SaaS)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "anthropic>=0.75",
    "openai>=1.55",
    "asyncpg>=0.30",
    "numpy>=2.1",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0.2",
    "azure-identity>=1.19",
    "azure-monitor-opentelemetry>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pip-audit>=2.7",
]

[project.scripts]
cloudbox = "backend.cli:main"

[tool.uv]
# Rebuild the project wheel whenever source files change (uv's default keys only on pyproject.toml, which
# let Docker builds reuse a stale cached wheel of this package).
cache-keys = [{ file = "pyproject.toml" }, { file = "backend/**/*.py" }, { file = "backend/**/*.sql" }]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]


# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["frontend", "infra"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "ASYNC",         # async pitfalls
    "SIM", "RUF", "PT", "C4", "PIE", "RET",
]
ignore = [
    "S101",    # assert is fine in tests (scoped below)
    "RUF001", "RUF002", "RUF003",  # unicode punctuation in prose strings is intentional
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # formatter wraps at 110; long description strings may run to 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PT011", "PT018", "RUF015", "E501"]
"backend/evaluation/**" = ["S311", "E501", "ASYNC240"]  # offline batch tool: small local file IO
"backend/agent/prompts.py" = ["E501"]
"backend/agent/output.py" = ["E501"]
"backend/security/content_safety.py" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^tests/", "^frontend/", "^infra/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "prometheus_client.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL+pgvector (DATABASE_URL); skipped otherwise",
    "live: calls a real LLM / embedding provider; skipped unless LIVE_TESTS=1",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/cli.py"]
